<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Azure Edge — M0</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1620; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #hud { position: fixed; left: 12px; top: 12px; color: #eaf6ff; background: rgba(5, 20, 30, 0.6); padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; }
      #hud b { color: #7cc4ff; }
      #debug { position: fixed; right: 12px; top: 12px; color: #d8ffe8; background: rgba(5, 25, 12, 0.75); padding: 10px 12px; border-radius: 8px; font: 12px/1.6 monospace; display: none; white-space: pre; }
      #debug.on { display: block; }
      #help { position: fixed; left: 12px; bottom: 12px; color: #cfe3f2; background: rgba(5, 20, 30, 0.6); padding: 8px 10px; border-radius: 8px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">Azure Edge — M0<br /><b id="status">Conectando…</b><br /><span id="player"></span></div>
    <div id="debug"></div>
    <div id="help">WASD mover · arrastar o mouse gira a câmera · <b>F3</b> painel de debug · <b>?latency=100</b> simula 100 ms de ping</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
