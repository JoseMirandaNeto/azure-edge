# Render Blueprint — Azure Edge M0 (server-game only, free tier)
# The client is static (apps/client/dist) — deploy it separately, e.g.
# Netlify Drop, and point it at this service with
#   ?server=wss://<this-service>.onrender.com
# or build the client with VITE_GAME_SERVER_URL set to that wss:// URL.
# See DEPLOY.md. Not yet tested end-to-end against a live Render service.
services:
  - type: web
    name: azure-edge-server-game
    runtime: node
    plan: free
    buildCommand: npm i -g pnpm@9.15.9 && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm --filter @azure-edge/server-game start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
